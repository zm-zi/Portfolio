<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#172629">
    <title>超时空激战 · 航迹飞行局</title>
    <link rel="icon" href="art/roundel.svg" type="image/svg+xml">
    <link rel="stylesheet" href="interface.css">
    <link rel="stylesheet" href="arcade-menu.css">
    <link rel="stylesheet" href="flight.css">
</head>
<body>
    <header class="mast">
        <div class="mast-inner">
            <button class="brand" data-action="hangar" id="nav-hangar" aria-label="返回飞行机库" aria-current="page">
                <img src="art/roundel.svg" width="48" height="40" alt=""><span><b>航迹飞行局</b><small>AIR ATLAS</small></span>
            </button>
            <div class="pilot-record" aria-label="最高纪录"><i data-icon="laurel"></i><span lang="en">HI-SCORE</span><b id="best-score" class="mono">00000</b></div>
            <button class="command" data-action="routes" id="nav-routes"><i data-icon="route"></i><span>航线图</span></button>
            <button class="command" id="open-settings" data-action="settings" aria-label="设置"><i data-icon="sliders"></i><span>设置</span></button>
        </div>
    </header>
    <main id="lobby" aria-labelledby="game-title">
        <div class="command-deck">
            <section class="poster" aria-labelledby="game-title">
                <canvas id="hangar-sky" aria-hidden="true"></canvas>
                <div class="poster-title"><h1 id="game-title"><span>超时空</span><strong>激战</strong></h1><span class="title-kicker" lang="en">SKYWARD ARCADE</span></div>
                <div class="flyby"><div class="formation"><span class="wing-trail left"></span><span class="wing-trail right"></span><span class="engine-flare"></span><img id="poster-plane" src="art/default.webp" alt=""></div></div>
                <div class="pilot-tag"><i data-icon="wing"></i><div><small id="plane-code" class="en"></small><strong id="plane-title"></strong><span id="plane-role"></span></div></div>
            </section>
            <section class="fleet" aria-labelledby="fleet-title">
                <header class="section-bar"><h2 id="fleet-title"><i data-icon="wing"></i>选择座机</h2><span id="fleet-count" class="mono"></span></header>
                <div id="fleet-options"></div>
            </section>
            <section class="dispatch" aria-labelledby="dispatch-title">
                <header class="section-bar"><h2 id="dispatch-title"><i data-icon="compass"></i>飞行模式</h2></header>
                <div id="mode-options" role="group" aria-labelledby="dispatch-title"></div>
                <div class="sortie-line"><p id="mode-brief"></p><button type="button" class="primary launch" id="launch" data-action="launch"><span>出击</span><kbd>ENTER</kbd><i data-icon="arrow"></i></button></div>
            </section>
        </div>
    </main>
    <main id="routes" class="desk" hidden>
        <div class="route-layout">
            <section class="route-poster">
                <div class="section-eyebrow">ROUTE ATLAS</div><h1>航线图</h1>
                <div id="map-diagram"></div><div class="route-map-note"><b id="map-name"></b><span id="map-progress"></span></div>
            </section>
            <section class="schedule"><header class="section-bar"><h2>选择作战航段</h2><span class="mono">01 — 07</span></header><div id="route-list"></div><button class="primary" data-action="start-level">执飞此航段 <i data-icon="arrow"></i></button></section>
        </div>
    </main>
    <main id="flight" hidden>
        <div class="flight-layout">
            <div class="airspace">
                <canvas id="gameCanvas" width="600" height="800" tabindex="-1" aria-label="飞行空域，使用方向键、WASD 或触屏拖动战机"></canvas>
                <div class="field-alert" id="field-alert" role="status" hidden></div>
            </div>
            <aside class="instruments" aria-label="飞行仪表">
                <header class="instrument-title"><div><small class="en" id="flight-heading">FLIGHT LOG</small><h2 id="flight-mode"></h2></div><button data-action="pause" id="pause" aria-label="暂停飞行"><i data-icon="pause"></i></button></header>
                <div class="score-read"><span>飞行得分</span><b id="flight-score" class="mono"></b></div>
                <div class="dials">
                    <div class="dial"><span>机体</span><div class="life-pips" id="life-pips"></div></div>
                    <div class="dial"><span>升级进度</span><div class="meter" id="xp-meter" role="progressbar" aria-label="升级进度" aria-valuemin="0" aria-valuemax="100"><i id="xp-bar"></i></div><b id="level-read"></b></div>
                </div>
                <div class="log-craft"><img id="flight-craft" alt=""><div><small class="en" id="flight-code"></small><b id="flight-name"></b></div></div>
                <section class="loadout"><h3>已装配</h3><p id="buff-log"></p></section>
                <button class="boost" id="boost" data-action="boost"><i data-icon="bolt"></i><span>超频</span><b class="mono" id="energy-read"></b></button>
                <p class="control-note" id="control-note"></p>
            </aside>
        </div>
    </main>
    <dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-body"><header class="sheet-head"><div><small class="en" id="sheet-code"></small><h2 id="sheet-title"></h2></div><button class="icon-button" id="sheet-close" data-action="back" aria-label="返回"><i data-icon="close"></i></button></header><div id="sheet-content"></div></div></dialog>
    <div id="save-status" role="status" hidden></div>
    <script src="js/core.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/save.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/state.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/entities/particle.js"></script>
    <script src="js/systems/collision.js"></script>
    <script src="js/entities/craft.js"></script>
    <script src="js/crafts/default.js"></script>
    <script src="js/crafts/skysovereign.js"></script>
    <script src="js/crafts/mozi.js"></script>
    <script src="js/crafts/chiHong.js"></script>
    <script src="js/systems/buff.js"></script>
    <script src="js/entities/player.js"></script>
    <script src="js/entities/bullet.js"></script>
    <script src="js/entities/gem.js"></script>
    <script src="js/entities/enemy.js"></script>
    <script src="js/entities/enemies/basic.js"></script>
    <script src="js/entities/enemies/shooter.js"></script>
    <script src="js/entities/enemies/rusher.js"></script>
    <script src="js/entities/enemies/minion.js"></script>
    <script src="js/entities/enemies/spinner.js"></script>
    <script src="js/entities/enemies/phantom.js"></script>
    <script src="js/entities/boss.js"></script>
    <script src="js/entities/bosses/one_eye_king.js"></script>
    <script src="js/entities/bosses/night_fury.js"></script>
    <script src="js/entities/bosses/ice_evil_king.js"></script>
    <script src="js/entities/bosses/julingshen.js"></script>
    <script src="js/flightArt.js"></script>
    <script src="js/arcadeFx.js"></script>
    <script src="js/ui/debugger.js"></script>
    <script src="js/ui/dispatch.js"></script>
    <script src="js/input.js"></script>
    <script src="js/gameLoop.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
