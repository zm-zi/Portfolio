<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超时空激战</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

        @font-face {
            font-family: 'HYPixel';
            src: url('font/HYPixel11pxU-2.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --arcade-bg:         #0d0d12;
            --arcade-bg-panel:   #161622;
            --arcade-bg-card:    #1e1e2e;
            --arcade-amber:      #ffb300;
            --arcade-amber-dim:  rgba(255,179,0,0.15);
            --arcade-amber-glow: rgba(255,179,0,0.4);
            --arcade-green:      #39ff14;
            --arcade-red:        #ff2e2e;
            --arcade-cyan:       #00e5ff;
            --arcade-magenta:    #ff00e5;
            --arcade-gold:       #ffd700;
            --arcade-white:      #e8e8f0;
            --arcade-dim:        rgba(255,255,255,0.35);
            --arcade-rare:       #44ff88;
            --arcade-epic:       #dd44dd;
            --arcade-legendary:  #ff3333;
            --arcade-border:     rgba(255,179,0,0.25);
            --arcade-border-bright: rgba(255,179,0,0.6);
            --arcade-glow-amber: 0 0 12px rgba(255,179,0,0.4);
            --arcade-glow-green: 0 0 12px rgba(57,255,20,0.4);
            --arcade-glow-red:   0 0 12px rgba(255,46,46,0.4);
            --arcade-glow-cyan:  0 0 12px rgba(0,229,255,0.4);
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(ellipse at 50% 30%, #1a1a2e 0%, #0d0d12 100%);
            font-family: 'VT323', monospace;
            overflow: hidden;
        }

        #game-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        #game-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ── Top Bar ── */
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 600px;
            padding: 8px 18px;
            background: var(--arcade-bg-panel);
            border: 2px solid var(--arcade-border);
            border-radius: 4px;
            box-shadow: var(--arcade-glow-amber), inset 0 0 0 1px rgba(255,179,0,0.06);
        }

        #top-bar .life {
            color: var(--arcade-green);
            font-family: 'VT323', monospace;
            font-size: 22px;
            font-weight: 400;
            width: 100px;
            text-shadow: 0 0 10px rgba(57,255,20,0.5);
            letter-spacing: 1px;
        }

        #top-bar .score {
            color: var(--arcade-gold);
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            font-weight: 400;
            width: 140px;
            text-align: right;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
            letter-spacing: 1px;
        }

        /* ── Boss Bar ── */
        #top-bar .boss-bar-wrap {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            margin: 0 12px;
        }
        #top-bar .boss-bar-wrap.active { display: flex; }

        #top-bar .boss-name {
            color: var(--arcade-red);
            font-family: 'VT323', monospace;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255,46,46,0.4);
        }

        #top-bar .boss-bar-bg {
            width: 100%;
            max-width: 280px;
            height: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 46, 46, 0.3);
            border-radius: 2px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }

        #top-bar .boss-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff2e2e, #ff6e40, #ff2e2e);
            background-size: 200% 100%;
            animation: bossBarShimmer 2s linear infinite;
            width: 100%;
            transition: width 0.15s ease-out;
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(255, 46, 46, 0.6);
        }

        @keyframes bossBarShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ── Energy Bar ── */
        #energy-bar-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 600px;
            padding: 2px 18px;
        }

        #energy-label {
            color: var(--arcade-cyan);
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            white-space: nowrap;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
        }

        #energy-bar-bg {
            flex: 1;
            height: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(0, 229, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5), 0 0 8px rgba(0, 229, 255, 0.1);
        }

        #energy-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #0066ff, #00e5ff, #80f0ff);
            width: 0%;
            transition: width 0.15s ease-out;
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
        }

        #energy-bar-fill.full {
            background: linear-gradient(90deg, #ffb300, #ffd700, #fff3b0);
            box-shadow: 0 0 16px rgba(255, 179, 0, 0.8), 0 0 30px rgba(255, 179, 0, 0.4);
            animation: energyPulse 0.4s ease-in-out infinite alternate;
        }

        @keyframes energyPulse {
            0% { box-shadow: 0 0 8px rgba(255,179,0,0.6), 0 0 16px rgba(255,179,0,0.3); opacity: 0.85; }
            100% { box-shadow: 0 0 24px rgba(255,179,0,1), 0 0 40px rgba(255,179,0,0.6); opacity: 1; }
        }

        #energy-key-hint {
            color: rgba(255, 255, 255, 0.3);
            font-family: 'VT323', monospace;
            font-size: 14px;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        /* ── Canvas ── */
        #canvas-wrap {
            position: relative;
            display: inline-block;
        }

        canvas {
            border: 2px solid var(--arcade-border-bright);
            border-radius: 4px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
            box-shadow: 0 0 20px rgba(255,179,0,0.1), 0 4px 20px rgba(0,0,0,0.6), inset 0 0 40px rgba(0,0,0,0.15);
        }

        #crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.06) 2px,
                rgba(0,0,0,0.06) 4px
            );
            z-index: 10;
            border-radius: 4px;
        }

        /* ── Level Bar ── */
        #level-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 56px;
            height: 700px;
            padding: 10px 5px;
            gap: 6px;
        }

        #level-label {
            color: var(--arcade-amber);
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(255,179,0,0.4);
        }

        #level-num {
            color: var(--arcade-gold);
            font-family: 'Press Start 2P', monospace;
            font-size: 24px;
            line-height: 1;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
        }

        #level-track {
            width: 14px;
            height: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid var(--arcade-border);
            border-radius: 2px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.5);
        }

        #level-fill {
            width: 100%;
            background: var(--arcade-amber);
            border-radius: 2px;
            transition: height 0.3s ease-out;
            height: 0%;
            flex-shrink: 0;
            box-shadow: 0 0 6px rgba(255, 179, 0, 0.4);
        }

        #level-next {
            color: var(--arcade-dim);
            font-family: 'VT323', monospace;
            font-size: 13px;
            text-align: center;
            min-height: 14px;
            letter-spacing: 0.5px;
        }

        #buff-list {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            width: 100%;
            padding: 4px 0;
        }

        .buff-tag {
            font-family: 'HYPixel', monospace;
            font-size: 14px;
            padding: 1px 6px;
            border-radius: 2px;
            background: rgba(22, 22, 34, 0.9);
            border-left: 3px solid var(--arcade-white);
            white-space: nowrap;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="game-wrap">
        <div id="top-bar">
            <span class="life">&#9829; <span id="life-val">5</span></span>
            <div class="boss-bar-wrap" id="boss-bar-wrap">
                <span class="boss-name" id="boss-name">BOSS</span>
                <div class="boss-bar-bg">
                    <div class="boss-bar-fill" id="boss-bar-fill"></div>
                </div>
            </div>
            <span class="score">SCORE <span id="score-val">0</span></span>
        </div>
        <div id="energy-bar-wrap">
            <span id="energy-label">POWER</span>
            <div id="energy-bar-bg">
                <div id="energy-bar-fill"></div>
            </div>
            <span id="energy-key-hint">SPACE(100)</span>
        </div>
        <div id="game-row">
            <div>
                <div id="buff-list"></div>
            </div>
            <div id="canvas-wrap">
                <canvas id="gameCanvas"></canvas>
                <div id="crt-overlay"></div>
            </div>
            <div id="level-bar">
                <div id="level-label">LV</div>
                <div id="level-num">0</div>
                <div id="level-track">
                    <div id="level-fill"></div>
                </div>
                <div id="level-next"></div>
            </div>
        </div>
    </div>
    <script src="js/core.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/state.js"></script>
    <script src="js/entities/particle.js"></script>
    <script src="js/systems/background.js"></script>
    <script src="js/systems/collision.js"></script>
    <script src="js/ui/common.js"></script>
    <script src="js/systems/buff.js"></script>
    <script src="js/ui/hud.js"></script>
    <script src="js/ui/startScreen.js"></script>
    <script src="js/ui/debugger.js"></script>
    <script src="js/ui/pauseOverlay.js"></script>
    <script src="js/ui/gameOver.js"></script>
    <script src="js/entities/player.js"></script>
    <script src="js/entities/bullet.js"></script>
    <script src="js/entities/gem.js"></script>

    <!-- 敌人注册表 + 具体敌人 -->
    <script src="js/entities/enemy.js"></script>
    <script src="js/entities/enemies/basic.js"></script>
    <script src="js/entities/enemies/shooter.js"></script>
    <script src="js/entities/enemies/rusher.js"></script>
    <script src="js/entities/enemies/minion.js"></script>
    <script src="js/entities/enemies/spinner.js"></script>

    <!-- Boss 注册表 + 具体 Boss -->
    <script src="js/entities/boss.js"></script>
    <script src="js/entities/bosses/one_eye_king.js"></script>
    <script src="js/entities/bosses/night_fury.js"></script>
    <script src="js/entities/bosses/ice_evil_king.js"></script>

    <script src="js/input.js"></script>
    <script src="js/gameLoop.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
